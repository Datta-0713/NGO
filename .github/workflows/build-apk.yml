name: Build Android APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci
        working-directory: ./mobile

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
        working-directory: ./mobile
        env:
          EXPO_TOKEN: ${{ secrets.GIT }}

      - name: Build APK with standard Gradle (low memory mode)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease -Pexpo.daemon.fallback=true -Pexpo.daemon.bypass=true --no-daemon --max-workers=2
        working-directory: ./mobile
        env:
          GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"
          
      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AsianNewsBureau-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

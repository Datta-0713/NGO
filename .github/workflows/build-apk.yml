name: Build Android APK

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci
        working-directory: ./mobile

      - name: Build APK locally on GitHub runner
        run: npx eas build --platform android --profile preview --local --non-interactive
        working-directory: ./mobile
        env:
          EXPO_TOKEN: ${{ secrets.GIT }}
          
      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AsianNewsBureau-APK
          path: mobile/build-*.apk
          
      - name: Find and Upload any APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsianNewsBureau-APK-Fallback
          path: mobile/**/*.apk
